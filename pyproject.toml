[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "participacion-agent"
version = "0.1.0"
description = "Deterministic CLI for auditable participation tracking from voice and chat evidence."
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "EdhuTech"}]
keywords = ["participation", "education", "audit", "google-workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
urls = {Homepage = "https://github.com/edhutech/participacion-agent", Repository = "https://github.com/edhutech/participacion-agent"}
dependencies = []

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]
xlsx = ["openpyxl>=3.1"]
dev = ["build>=1.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
participacion-sync = "participacion.cli.main:main"
participacion-init = "participacion.cli.init:main"
participacion-google-auth = "participacion.cli.google_auth:main"
eira-pilot = "participacion.cli.pilot:main"
eira-setup = "participacion.cli.cloud:setup_main"
eira-run = "participacion.cli.cloud:run_main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["participacion*"]
namespaces = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731", "F841"]

[tool.mypy]
python_version = "3.10"
files = ["src/participacion/core", "src/participacion/application/registry.py",
         "src/participacion/application/ports/contracts.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
