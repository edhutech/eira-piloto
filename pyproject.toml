[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "participacion-agent"
version = "0.1.0"
description = "Deterministic participation synchronization"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
participacion-sync = "src.sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
