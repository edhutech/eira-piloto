[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "participacion-agent"
version = "0.1.0"
description = "Deterministic participation synchronization"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "EdhuTech"}]
keywords = ["participation", "education", "audit", "google-workspace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
urls = {Homepage = "https://github.com/edhutech/participacion-agent", Repository = "https://github.com/edhutech/participacion-agent"}
dependencies = []

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
]
xlsx = ["openpyxl>=3.1"]
dev = ["build>=1.0", "pytest>=7.0"]

[project.scripts]
participacion-sync = "participacion.cli.main:main"
participacion-init = "participacion.cli.init:main"
participacion-google-auth = "participacion.cli.google_auth:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["participacion*"]
namespaces = true
