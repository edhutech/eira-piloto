[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "participacion-agent"
version = "0.1.0"
description = "Deterministic participation synchronization"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
participacion-sync = "participacion.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["participacion*"]
namespaces = true
