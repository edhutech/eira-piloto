name: CI

on:
  push:
  pull_request:

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev,google,xlsx]"
      - run: python -m unittest discover -s tests -q
      - run: ruff check src tests
      - run: mypy
      - run: python -m compileall -q src/participacion
      - run: python -m build
      - run: eira-setup --help
      - run: eira-run --help
